<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f5f2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Cutout" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/logo.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <title>Cutout — Background removal studio</title>
  <meta name="description" content="Remove photo backgrounds privately in your browser, then export with a color or gradient." />
  <script src="./vendor/tailwind-browser-4.3.3.js"></script>
  <link rel="stylesheet" href="./style.css" />
  <style type="text/tailwindcss">
    @theme {
      --color-forest: #1c3631;
      --color-muted: #718071;
      --color-line: #dce2d6;
      --color-paper: #f6f7f2;
      --color-clay: #ae5f45;
      --color-sage: #eef4e8;
      --color-sage-ink: #526d43;
    }
  </style>
</head>
<body>
  <div id="app" v-cloak></div>
  <template id="app-template">
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"><span></span></span><span class="brand-wordmark"><span>cutout<span class="brand-dot">.</span></span><button
          class="brand-version min-h-5 border-0 bg-transparent p-0 text-left"
          :aria-label="'App version ' + APP_VERSION + (developerTools ? ', developer tools shown' : ', developer tools hidden')"
          :aria-pressed="developerTools"
          @click="revealDeveloperTools"
        >v{{ APP_VERSION }}<span v-if="developerTools" class="ml-1 rounded bg-amber-50 px-1 text-[9px] font-semibold text-amber-800">TOOLS ON</span><span v-if="previewSupporter" class="ml-1 rounded bg-amber-50 px-1 text-[9px] font-semibold text-amber-800">PREVIEW ON</span></button></span></div>
      <div class="topbar-actions flex items-center gap-3 sm:gap-6"><span v-if="previewSupporter" class="hidden rounded-full bg-amber-50 px-2 py-1 text-[10px] font-semibold text-amber-800 sm:inline-flex">TEST MODE</span><div class="topbar-right"><span class="privacy-dot"></span> Private, in your browser</div><giving-panel v-model="givingOpen" :diagnostics="getDiagnostics" :preview="previewSupporter" @supporter="updateSupporter"></giving-panel></div>
    </header>

    <main class="main-layout">
      <section class="intro">
        <div class="eyebrow"><span class="eyebrow-line"></span> THE SIMPLE PHOTO STUDIO</div>
        <h1>Every image deserves<br><em>a fresh backdrop.</em></h1>
        <p>Remove the background from a photo, find the right finish, and take it with you. All right here in your browser.</p>
      </section>

      <div class="workspace">
        <section class="editor-panel" aria-label="Image editor">
          <div class="panel-head"><div><span class="section-index">01 / CANVAS</span><h2>Your workspace</h2></div><span class="panel-caption">{{ dimensions || 'READY WHEN YOU ARE' }}</span></div>
          <div class="stage" :class="{ 'stage-drag': dragOver, 'stage-empty': !originalUrl }" :style="resultUrl && !showOriginal ? previewStyle : {}" @dragover.prevent="dragOver = true" @dragleave.prevent="dragOver = false" @drop.prevent="onDrop">
            <div v-if="!originalUrl" class="empty-state">
              <div class="empty-icon"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect x="6" y="7" width="36" height="34" rx="4" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="18" r="3" stroke="currentColor" stroke-width="1.6"/><path d="m8 34 11-11 7 7 5-5 9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              <h3>Drop your image here</h3><p>or choose a photo to get started</p>
              <button class="button button-dark" :disabled="batchRunning || presetSaving || archiveBusy || finishingBusy" @click="fileInput.click()"><span>Choose a photo</span><span aria-hidden="true">↗</span></button>
              <small>JPG, PNG, WebP · One image at a time</small>
            </div>
            <template v-else>
              <div v-if="resultUrl && !showOriginal && selected === 'transparent'" class="checkerboard"></div>
              <img class="stage-image" :src="resultUrl && !showOriginal ? resultUrl : originalUrl" :alt="resultUrl && !showOriginal ? 'Photo with background removed' : 'Original uploaded photo'" @error="previewError" />
              <div v-if="busy" class="processing-shade"><span class="spinner"></span><strong>{{ stageText }}</strong><small>{{ statusDetail }}</small></div>
              <span class="image-badge">{{ resultUrl && !showOriginal ? 'AFTER' : 'BEFORE' }}</span>
            </template>
          </div>
          <div v-if="originalUrl || canRetry" class="canvas-footer">
            <div class="canvas-actions">
              <button v-if="resultUrl" class="canvas-button compare-button" :class="{ 'is-active': showOriginal }" :aria-pressed="showOriginal" :disabled="busy || shareBusy || batchRunning || presetSaving || archiveBusy || finishingBusy" @click="showOriginal = !showOriginal" @contextmenu.prevent>
                <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M10 3.5v13M6.5 8l-2 2 2 2m7-4 2 2-2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Compare original
              </button>
              <button class="canvas-button change-button" :disabled="busy || shareBusy || batchRunning || presetSaving || archiveBusy || finishingBusy" @click="fileInput.click()">
                <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                Change image
              </button>
            </div>
            <button class="canvas-button reset-button" :disabled="busy || shareBusy || batchRunning || presetSaving || archiveBusy || finishingBusy" @click="clearImage()">
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 8a6 6 0 1 1 .8 6M4 3.5V8h4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Start over
            </button>
            <p v-if="fileName" class="file-label" :title="fileName">{{ fileName }}</p>
          </div>
          <section class="mt-6 border-t border-line pt-6" aria-label="Batch workspace">
            <div class="flex items-center justify-between gap-3">
              <h3 class="m-0 text-lg font-semibold tracking-tight">Batch processing</h3>
              <span class="rounded-full bg-paper px-2 py-1 text-[9px] font-semibold text-muted">
                {{ supporter ? 'SUPPORTER' : 'EXTRA' }}
              </span>
            </div>
            <p class="mt-2 mb-0 text-xs leading-relaxed text-muted">
              Choose up to 20 photos. We’ll process them one at a time and keep the finished PNGs here.
            </p>

            <template v-if="supporter">
              <button
                class="mt-4 min-h-12 w-full rounded-xl bg-forest px-4 text-sm font-semibold text-white disabled:opacity-50"
                :disabled="busy || shareBusy || batchRunning || presetSaving || archiveBusy || finishingBusy"
                @click="batchInput.click()"
              >Choose a batch of photos</button>
              <input ref="batchInput" class="sr-only" type="file" multiple accept="image/*" @change="runBatch">
              <p class="mt-3 mb-0 text-[11px] leading-relaxed text-muted">
                Uses your selected backdrop. Up to 40 MB per photo. Keep Cutout open while processing.
              </p>

              <div v-if="batchRunning" class="mt-4 flex flex-wrap items-center gap-3 text-xs" role="status">
                <span class="size-4 shrink-0 animate-spin rounded-full border-2 border-line border-t-clay"></span>
                <strong class="min-w-0 flex-1 break-words">{{ batchProgress }}</strong>
                <button class="min-h-11 font-semibold text-clay" :disabled="batchStop" @click="batchStop = true">
                  {{ batchStop ? 'Pausing…' : 'Pause after this photo' }}
                </button>
              </div>
              <ul v-if="batchErrors.length" class="mt-3 pl-4 text-xs leading-relaxed text-red-800">
                <li v-for="failure in batchErrors" :key="failure">{{ failure }}</li>
              </ul>
              <div v-if="outputs.length" class="mt-4 flex flex-wrap items-center justify-between gap-2">
                <span class="text-xs font-semibold">Saved photos · {{ outputs.length }}</span>
                <button class="min-h-11 rounded-xl bg-forest px-4 text-xs font-semibold text-white disabled:opacity-50" :disabled="busy || shareBusy || batchRunning || presetSaving || archiveBusy || finishingBusy" @click="downloadBatch">Download all · ZIP ↓</button>
              </div>
              <div v-if="archiveBusy" class="mt-2 flex items-center justify-between gap-2 text-xs text-muted" role="status">
                <span>{{ archiveProgress }}</span><button class="min-h-11 px-2 font-semibold text-clay" @click="cancelArchive">Cancel</button>
              </div>
              <div v-if="outputs.some(output => output.editable)" class="mt-4 rounded-2xl border border-line bg-paper p-3">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <p class="m-0 text-xs font-semibold">One finish for all photos</p>
                  <span class="text-[10px] text-muted">Tap a backdrop to apply</span>
                </div>
                <div class="mt-2 flex flex-wrap gap-1" role="group" aria-label="Finish all saved photos">
                  <button v-for="choice in choices" :key="choice.id" class="flex min-h-14 w-14 flex-col items-center justify-center gap-1 rounded-xl disabled:opacity-40" :class="outputs.filter(output => output.editable).every(output => output.backdropId === choice.id) ? 'bg-white ring-1 ring-clay' : 'hover:bg-white'" :aria-label="'Apply ' + choice.name + ' to all saved photos'" :aria-pressed="outputs.filter(output => output.editable).every(output => output.backdropId === choice.id)" :disabled="busy || shareBusy || batchRunning || presetSaving || archiveBusy || finishingBusy" @click="finishOutputs(choice.id)">
                    <span class="block size-6 rounded-full border border-line" :class="{checkered: choice.kind === 'transparent'}" :style="choice.kind === 'solid' ? { background: choice.color } : choice.kind === 'gradient' ? { background: `linear-gradient(135deg, ${choice.colors.join(', ')})` } : choice.kind === 'image' ? { backgroundImage: `url(${choice.url})`, backgroundSize: 'cover', backgroundPosition: 'center' } : {}"></span>
                    <span class="max-w-full truncate text-[9px]">{{ choice.name }}</span>
                  </button>
                </div>
                <p class="mt-2 mb-0 text-[10px] leading-relaxed text-muted">Or tap a photo below to give it its own finish. Changes are saved here automatically.</p>
              </div>
              <div v-if="finishingBusy" class="mt-3 flex items-center justify-between gap-2 text-xs text-muted" role="status">
                <span>{{ finishProgress }}</span><button class="min-h-11 shrink-0 font-semibold text-clay" :disabled="finishStop" @click="finishStop = true">{{ finishStop ? 'Pausing…' : 'Pause after this photo' }}</button>
              </div>
              <ul class="m-0 mt-3 grid list-none grid-cols-2 gap-3 p-0 sm:grid-cols-3">
                <li v-for="output in outputs" :key="output.id" class="min-w-0 overflow-hidden rounded-2xl border bg-white" :class="selectedOutputId === output.id ? 'border-clay ring-1 ring-clay' : 'border-line'">
                  <button class="checkered relative flex aspect-square w-full items-center justify-center overflow-hidden border-0 p-0" :aria-label="'Finish ' + output.name" :aria-expanded="selectedOutputId === output.id" :disabled="!output.editable || busy || shareBusy || batchRunning || archiveBusy || presetSaving || finishingBusy" @click="selectOutput(output.id)">
                    <img v-if="output.thumbnailUrl" :src="output.thumbnailUrl" :alt="output.name" loading="lazy" class="block size-full object-contain">
                    <span v-else class="px-3 text-center text-xs text-muted">Saved PNG<br>Preview unavailable</span>
                    <span v-if="selectedOutputId === output.id" class="absolute top-2 right-2 grid size-6 place-items-center rounded-full bg-white text-xs text-clay shadow-sm" aria-hidden="true">✓</span>
                  </button>
                  <div class="p-2.5">
                    <p class="m-0 truncate text-[11px] font-medium" :title="output.name">{{ output.name }}</p>
                    <small class="mt-1 block text-[10px] text-muted">{{ (output.bytes / 1048576).toFixed(1) }} MB</small>
                    <button v-if="output.editable" class="mt-1 flex min-h-11 w-full items-center justify-between gap-1 rounded-lg text-left text-[10px] text-clay" :disabled="busy || shareBusy || batchRunning || archiveBusy || presetSaving || finishingBusy" :aria-expanded="selectedOutputId === output.id" @click="selectOutput(output.id)"><span class="truncate">{{ output.backdropName || 'Transparent' }}</span><span class="shrink-0 font-semibold">Finish {{ selectedOutputId === output.id ? '−' : '+' }}</span></button>
                    <p v-else class="mt-2 mb-0 text-[10px] leading-relaxed text-muted">Reprocess to change the finish.</p>
                    <div v-if="selectedOutputId === output.id" class="mt-1 grid grid-cols-2 gap-1 rounded-xl bg-paper p-1 sm:grid-cols-3" role="group" :aria-label="'Background for ' + output.name">
                      <button v-for="choice in choices" :key="choice.id" class="flex min-h-14 min-w-0 flex-col items-center justify-center gap-1 rounded-lg disabled:opacity-40" :class="output.backdropId === choice.id ? 'bg-white ring-1 ring-clay' : 'hover:bg-white'" :aria-label="'Finish this photo with ' + choice.name" :aria-pressed="output.backdropId === choice.id" :disabled="busy || shareBusy || batchRunning || archiveBusy || presetSaving || finishingBusy" @click="finishOutputs(choice.id, output.id)">
                        <span class="block size-5 rounded-full border border-line" :class="{checkered: choice.kind === 'transparent'}" :style="choice.kind === 'solid' ? { background: choice.color } : choice.kind === 'gradient' ? { background: `linear-gradient(135deg, ${choice.colors.join(', ')})` } : choice.kind === 'image' ? { backgroundImage: `url(${choice.url})`, backgroundSize: 'cover', backgroundPosition: 'center' } : {}"></span>
                        <span class="max-w-full truncate text-[9px]">{{ choice.name }}</span>
                      </button>
                    </div>
                    <div class="mt-2 flex items-center gap-1">
                      <button class="min-h-11 min-w-0 flex-1 rounded-lg bg-sage px-1 text-[11px] font-semibold text-forest" :disabled="finishingBusy" :aria-label="'Download ' + output.name" @click="downloadOutput(output.id)">Download ↓</button>
                      <button class="grid size-11 shrink-0 place-items-center rounded-lg text-muted" :disabled="batchRunning || archiveBusy || finishingBusy" :aria-label="'Remove saved output ' + output.name" @click="removeOutput(output.id)"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M10 3h4l1 4H9l1-4ZM6 7l1 14h10l1-14M10 11v6m4-6v6"/></svg></button>
                    </div>
                  </div>
                </li>
              </ul>
              <p v-if="outputs.length" class="mt-3 mb-0 text-[11px] leading-relaxed text-muted">
                Downloaded images stay here until you remove them. Removing a saved copy cannot be undone.
              </p>
            </template>
            <button v-else class="mt-4 min-h-11 w-full rounded-xl border border-line px-4 text-xs font-semibold text-clay" @click="openGiving">
              Support Cutout to open the extras
            </button>
            <p v-if="studioNotice" class="mt-3 mb-0 rounded-xl bg-sage p-3 text-xs leading-relaxed text-sage-ink" role="status">{{ studioNotice }}</p>
            <p v-if="supporter && storageNotice" class="mt-3 mb-0 text-[11px] leading-relaxed text-muted">{{ storageNotice }}</p>
          </section>
          <input ref="fileInput" :disabled="batchRunning || presetSaving || archiveBusy || finishingBusy" class="sr-only" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" @change="onFileChange" />
        </section>

        <aside class="controls-panel">
          <div class="control-section model-section"><div class="section-top"><span class="section-index">02 / PROCESS</span><span class="status-pill" :class="{ active: backend && phase !== 'error', danger: phase === 'error' }"><span></span>{{ phase === 'error' ? 'ERROR' : busy ? 'WORKING' : modelLoaded ? 'MODEL LOADED' : phase === 'complete' ? 'IMAGE READY' : 'NOT LOADED' }}</span></div><h2>Remove the background</h2><p class="section-description">Powered by ORMBG. {{ backend ? `${modelLoaded ? 'Running' : 'Processed'} on ${backend}.` : 'WebGPU first, WASM when needed.' }} Your photo stays on your device.</p>
            <div class="status-card" role="status" aria-live="polite"><div class="status-icon" :class="{ spinning: busy }">✳</div><div class="status-copy"><strong>{{ stageText }}</strong><span>{{ statusDetail }}</span></div></div>
            <div v-if="phase === 'loading' && downloadProgress !== null" class="progress-wrap"><div class="progress-track"><span :style="{ width: `${downloadProgress}%` }"></span></div><small>{{ downloadFile }} · {{ downloadProgress }}%</small></div>
            <p v-if="error" class="error-text">{{ error }}</p>
            <button v-if="busy && !exportBusy && phase !== 'compositing'" class="text-action" @click="cancelRun">Stop processing</button>
            <button v-if="phase === 'error' && canRetry && !busy" class="button button-outline full" @click="retryWasm">Retry with WASM <span aria-hidden="true">↗</span></button>
            <button v-if="!modelLoaded && !busy && !resultUrl" class="button button-outline full" :disabled="batchRunning || presetSaving || archiveBusy || finishingBusy" @click="loadModel()">Load model <span aria-hidden="true">↗</span></button>
          </div>

          <div class="control-section backdrop-section"><span class="section-index">03 / FINISH</span><div class="section-title-row"><div><h2>Choose a backdrop</h2><p class="section-description">Preview a look, then export it as a PNG.</p></div></div>
            <div class="swatch-grid" role="group" aria-label="Background choices"><button v-for="choice in choices" :key="choice.id" class="swatch" :class="{ selected: selected === choice.id }" :aria-pressed="selected === choice.id" :disabled="batchRunning || presetSaving || archiveBusy || finishingBusy" @click="selectBackground(choice.id)"><span class="swatch-color" :class="{ checkered: choice.kind === 'transparent' }" :style="choice.kind === 'solid' ? { background: choice.color } : choice.kind === 'gradient' ? { background: `linear-gradient(135deg, ${choice.colors.join(', ')})` } : choice.kind === 'image' ? { backgroundImage: `url(${choice.url})`, backgroundSize: 'cover', backgroundPosition: 'center' } : {}"><span v-if="selected === choice.id" class="swatch-check">✓</span></span><span>{{ choice.name }}</span></button></div>
            <details class="brand-presets border-t border-line py-4">
              <summary class="flex min-h-11 cursor-pointer items-center justify-between gap-3 text-xs font-semibold text-forest">
                Saved backdrops
                <span class="text-[10px] font-normal text-muted">{{ supporter ? presets.length + ' saved' : 'EXTRA' }}</span>
              </summary>
              <template v-if="supporter">
                <p class="mt-2 mb-0 text-xs leading-relaxed text-muted">Keep your favorite colors, gradients, and images for next time.</p>
                <label class="mt-4 block text-xs text-muted">
                  Backdrop name
                  <input v-model="presetName" maxlength="40" placeholder="My brand backdrop" class="mt-2 block min-h-11 w-full rounded-lg border border-line px-3 text-sm text-forest" :disabled="busy || batchRunning || presetSaving || archiveBusy || finishingBusy">
                </label>
                <label class="mt-4 block text-xs text-muted">
                  Backdrop style
                  <select v-model="presetKind" class="mt-2 block min-h-11 w-full rounded-lg border border-line bg-white px-3 text-sm text-forest" :disabled="busy || batchRunning || presetSaving || archiveBusy || finishingBusy">
                    <option value="solid">Solid color</option>
                    <option value="gradient">Two-color gradient</option>
                    <option value="image">Background image</option>
                  </select>
                </label>
                <div v-if="presetKind !== 'image'" class="mt-4 flex gap-4 text-xs text-muted">
                  <label>First color<input v-model="colorOne" type="color" class="mt-2 block h-11 w-20 rounded-lg border border-line bg-white p-1" :disabled="busy || batchRunning || presetSaving || archiveBusy || finishingBusy"></label>
                  <label v-if="presetKind === 'gradient'">Second color<input v-model="colorTwo" type="color" class="mt-2 block h-11 w-20 rounded-lg border border-line bg-white p-1" :disabled="busy || batchRunning || presetSaving || archiveBusy || finishingBusy"></label>
                </div>
                <div v-else class="mt-4 rounded-xl border border-line bg-paper p-3">
                  <p class="m-0 text-xs font-semibold">Upload a background</p>
                  <p class="mt-2 mb-0 text-[11px] leading-relaxed text-muted">This image sits behind your cutout. Choose a texture, scene, or branded backdrop.</p>
                  <input ref="presetImageInput" type="file" accept="image/*" class="sr-only" :disabled="busy || batchRunning || presetSaving || archiveBusy || finishingBusy" @change="presetImage = $event.target.files?.[0] || null">
                  <button class="mt-3 min-h-11 w-full rounded-lg border border-line bg-white px-3 text-xs font-semibold" :disabled="busy || batchRunning || presetSaving || archiveBusy || finishingBusy" @click="presetImageInput.click()">{{ presetImage ? 'Change background image' : 'Choose background image' }}</button>
                  <p v-if="presetImage" class="mt-2 mb-0 truncate text-[11px] text-sage-ink" :title="presetImage.name">Selected: {{ presetImage.name }}</p>
                  <p class="mt-2 mb-0 text-[10px] leading-relaxed text-muted">Up to 10 MB · Saved at up to 1600 px. Centered and cropped to fill your photo. Name it above, then save below.</p>
                </div>
                <button class="mt-4 min-h-11 w-full rounded-xl bg-forest px-4 text-xs font-semibold text-white disabled:opacity-50" :disabled="busy || shareBusy || batchRunning || presetSaving || archiveBusy || finishingBusy || !presetName.trim()" @click="savePreset">
                  {{ presetSaving ? 'Saving…' : 'Save backdrop' }}
                </button>
                <ul class="m-0 mt-3 list-none divide-y divide-line p-0">
                  <li v-for="preset in presets" :key="preset.id" class="flex items-center justify-between gap-2">
                    <button class="min-h-11 min-w-0 flex-1 text-left text-xs break-words text-forest" :disabled="busy || batchRunning || presetSaving || archiveBusy || finishingBusy" @click="selectBackground(preset.id)">{{ preset.name }}</button>
                    <button class="size-11 shrink-0 text-xl text-muted" :disabled="busy || batchRunning || presetSaving || archiveBusy || finishingBusy" :aria-label="'Delete backdrop ' + preset.name" @click="removePreset(preset.id)">×</button>
                  </li>
                </ul>
                <p v-if="studioNotice" class="mt-3 mb-0 text-xs leading-relaxed text-muted" role="status">{{ studioNotice }}</p>
              </template>
              <template v-else>
                <p class="mt-2 mb-0 text-xs leading-relaxed text-muted">Give $10 or more to save your own backdrops.</p>
                <button class="mt-3 min-h-11 w-full rounded-xl border border-line px-3 text-xs font-semibold text-clay" @click="openGiving">Support Cutout</button>
              </template>
            </details>
            <div class="export-box"><div><strong>Ready for the final touch?</strong><span>Full resolution · PNG</span></div><div class="export-actions"><a v-if="exportUrl && !busy && !batchRunning" class="button button-accent" :href="exportUrl" :download="exportName">Download image</a><button v-else class="button button-accent" disabled>Download image</button><button v-if="canShareFile" class="button button-share" :disabled="busy || shareBusy || batchRunning || presetSaving || archiveBusy || finishingBusy" @click="shareImage">{{ shareBusy ? 'Sharing…' : 'Share / Save…' }}</button></div></div>
            <p v-if="canShareFile" class="section-description">On iPhone, choose Save Image in the share sheet to save to Photos when available.</p>
            <p v-if="exportMessage" class="section-description" role="status">{{ exportMessage }}</p>
          </div>

          <div class="cache-section"><div class="cache-top"><span class="section-index">MODEL STORAGE</span><span class="cache-indicator"></span></div><p>Saved in this browser’s <strong>Cache Storage</strong> for <code>{{ origin }}</code>. Find it in Developer Tools → Application → Cache Storage → <code>{{ CACHE_KEY }}</code>.</p><div class="cache-footer"><span>{{ cacheAvailable ? `${cacheFiles} cached files · ${cacheFiles ? cacheSize : 'No model saved yet'}` : 'Cache Storage unavailable' }}</span><button :disabled="!cacheFiles || busy || batchRunning || presetSaving || archiveBusy || finishingBusy" @click="clearCache">Clear model cache ↗</button></div></div>
          <section class="pwa-section" aria-label="Install Cutout">
            <div class="pwa-heading"><img src="./icons/icon-192.png" width="40" height="40" alt="" /><div><strong>{{ pwaState.installed ? 'Cutout is installed' : 'Keep Cutout close' }}</strong><span>{{ pwaState.installed ? 'Your photo studio, in its own window.' : 'Add your photo studio to your home screen or desktop.' }}</span></div></div>
            <button v-if="pwaState.installable && !pwaState.installed" class="button button-outline full" @click="installApp">Install Cutout <span aria-hidden="true">↗</span></button>
            <p v-else-if="!pwaState.installed" class="section-description">On iPhone or iPad, open Safari’s Share menu and choose Add to Home Screen. On desktop, use your browser’s install menu when available.</p>
            <p class="section-description">{{ pwaState.offline ? 'You’re offline. The interface is available; connect to load the model.' : 'The interface can reopen offline after your first visit. Connect to load the model and process photos.' }}</p>
            <p class="section-description" role="status">{{ !pwaState.supported ? 'Offline installation is unavailable in this browser. Try Safari or Chrome.' : pwaState.offlineReady ? 'Offline interface ready.' : 'Preparing the offline interface…' }}</p>
            <p v-if="pwaState.updateAvailable" class="section-description" role="status">An update is ready. It will apply automatically when no photo is open. Save your image, then start over when you’re ready.</p>
            <p v-if="pwaState.message" class="section-description" role="status">{{ pwaState.message }}</p>
          </section>
          <details class="diagnostics-section" :open="Boolean(interruptedNotice) || developerTools"><summary>Help &amp; diagnostics</summary><p v-if="interruptedNotice" class="section-description">{{ interruptedNotice }}</p><p class="section-description">Copy processing steps, image dimensions, browser details, and errors. Photos and filenames are not included. The latest steps are saved in this browser to help after an unexpected reload.</p><label class="wasm-option"><input type="checkbox" v-model="preferWasm" :disabled="busy"> Use WASM for the next run</label><button class="button button-outline full" @click="copyDiagnostics">Copy diagnostics <span aria-hidden="true">↗</span></button><p v-if="diagnosticMessage" class="section-description" role="status">{{ diagnosticMessage }}</p><textarea v-if="diagnosticText" class="diagnostic-report" aria-label="Diagnostic report" :value="diagnosticText" readonly @focus="$event.target.select()"></textarea><small>App {{ APP_VERSION }}</small>
            <section
              v-if="developerTools"
              id="developer-tools"
              class="mt-5 rounded-xl border border-amber-200 bg-amber-50 p-4 text-xs text-amber-900"
              aria-label="Developer tools"
            >
              <p class="m-0 font-semibold">Temporary developer preview</p>
              <label class="mt-3 flex min-h-11 items-center gap-3">
                <input
                  type="checkbox"
                  class="size-4 accent-[#1c3631]"
                  :checked="previewSupporter"
                  :disabled="(busy && canRetry) || shareBusy || batchRunning || presetSaving || archiveBusy || finishingBusy"
                  @change="setPreviewSupporter($event.target.checked)"
                >
                Preview supporter features
              </label>
              <p class="mt-2 mb-0 leading-relaxed">Unlocks presets, batches, and notes for testing in this tab. No gift is recorded and no supporter code is issued.</p>
            </section>
          </details>
        </aside>
      </div>
      <section class="mt-7 flex flex-wrap items-center justify-between gap-4 rounded-2xl border border-line bg-paper p-6">
        <div>
          <h2 class="m-0 text-lg font-semibold tracking-tight">Like your fresh backdrop?</h2>
          <p class="mt-1 mb-0 text-xs leading-relaxed text-muted">Support this open source project and enjoy a few extras.</p>
        </div>
        <button class="min-h-11 rounded-xl bg-forest px-5 text-xs font-semibold text-white" @click="openGiving">
          {{ supporter ? 'Message' : 'Give $10 or more' }}
        </button>
      </section>
      <footer class="page-footer"><span>Made for simple, private image making.</span><span>v{{ APP_VERSION }} · POWERED BY TRANSFORMERS.JS + ORMBG</span></footer>
    </main>
  </div>
  </template>
  <script type="module" src="./app.js"></script>
</body>
</html>
