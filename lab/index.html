<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f5f2" />
  <title>Cutout — Background removal studio</title>
  <meta name="description" content="Remove photo backgrounds privately in your browser, then export with a color or gradient." />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app" v-cloak></div>
  <template id="app-template">
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"><span></span></span><span>cutout<span class="brand-dot">.</span></span></div>
      <div class="topbar-right"><span class="privacy-dot"></span> Private, in your browser <span class="topbar-separator"></span> <span class="topbar-version">MODEL LAB / 01</span></div>
    </header>

    <main class="main-layout">
      <section class="intro">
        <div class="eyebrow"><span class="eyebrow-line"></span> THE SIMPLE PHOTO STUDIO</div>
        <h1>Every image deserves<br><em>a fresh backdrop.</em></h1>
        <p>Try three browser-based cutout models. Compare the same photo, choose your favorite, and take it with you.</p>
      </section>

      <section class="model-library" aria-label="Background removal models">
        <div class="model-library-head"><div><span class="section-index">01 / PICK A MODEL</span><h2>Choose your cutout engine</h2></div><span class="panel-caption">ONE PHOTO · THREE MODELS</span></div>
        <div class="model-grid" role="group" aria-label="Models to compare">
          <button v-for="model in models" :key="model.id" class="model-card" :class="{ selected: selectedModel === model.id }" :aria-pressed="selectedModel === model.id" :disabled="busy" @click="selectModel(model.id)">
            <span class="model-card-top"><span class="model-radio"></span><span class="model-license" :class="{ mit: model.license !== 'Non-commercial' }">{{ model.license }}</span></span>
            <strong>{{ model.name }}</strong><small>{{ model.note }}</small><span class="model-card-bottom">{{ model.size }} model <span aria-hidden="true">↗</span></span>
          </button>
        </div>
        <p class="model-footnote">Model sizes are download estimates. ORMBG and BRIA offer a backend comparison below. MODNet uses WASM for reliable portrait results. BRIA is licensed for non-commercial use. <a :href="currentModel.url" target="_blank" rel="noopener">View selected model ↗</a></p>
      </section>

      <div class="workspace">
        <section class="editor-panel" aria-label="Image editor">
          <div class="panel-head"><div><span class="section-index">02 / CANVAS</span><h2>Your workspace</h2></div><span class="panel-caption">{{ dimensions || 'READY WHEN YOU ARE' }}</span></div>
          <div class="stage" :class="{ 'stage-drag': dragOver, 'stage-empty': !originalUrl }" :style="resultUrl && !showOriginal ? previewStyle : {}" @dragover.prevent="dragOver = true" @dragleave.prevent="dragOver = false" @drop.prevent="onDrop">
            <div v-if="!originalUrl" class="empty-state">
              <div class="empty-icon"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect x="6" y="7" width="36" height="34" rx="4" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="18" r="3" stroke="currentColor" stroke-width="1.6"/><path d="m8 34 11-11 7 7 5-5 9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              <h3>Drop your image here</h3><p>or choose a photo to get started</p>
              <button class="button button-dark" @click="fileInput.click()"><span>Choose a photo</span><span aria-hidden="true">↗</span></button>
              <small>JPG, PNG, WebP · One image at a time</small>
            </div>
            <template v-else>
              <div v-if="resultUrl && !showOriginal && selected === 'transparent'" class="checkerboard"></div>
              <img class="stage-image" :src="resultUrl && !showOriginal ? resultUrl : originalUrl" :alt="resultUrl && !showOriginal ? 'Photo with background removed' : 'Original uploaded photo'" />
              <div v-if="busy" class="processing-shade"><span class="spinner"></span><strong>{{ stageText }}</strong><small>{{ statusDetail }}</small></div>
              <span class="image-badge">{{ resultUrl && !showOriginal ? 'AFTER' : 'BEFORE' }}</span>
            </template>
          </div>
          <div class="canvas-footer"><div class="file-label"><span class="file-icon">▧</span><span class="truncate">{{ fileName || 'No image selected' }}</span></div><div class="canvas-actions"><button v-if="resultUrl" class="text-action" @pointerdown="showOriginal = true" @pointerup="showOriginal = false" @pointerleave="showOriginal = false" @keydown.space.prevent="showOriginal = true" @keyup.space="showOriginal = false">Hold to compare</button><button class="text-action" @click="fileInput.click()">{{ originalUrl ? 'Change image' : 'Upload image' }} <span aria-hidden="true">↗</span></button></div></div>
          <input ref="fileInput" class="sr-only" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" @change="onFileChange" />
        </section>

        <aside class="controls-panel">
          <div class="control-section model-section"><div class="section-top"><span class="section-index">03 / PROCESS</span><span class="status-pill" :class="{ active: loadedSelected, danger: phase === 'error' }"><span></span>{{ loadedSelected ? 'MODEL LOADED' : phase === 'error' ? 'ERROR' : busy ? 'LOADING' : 'NOT LOADED' }}</span></div><h2>{{ currentModel.name }}</h2><p class="section-description">{{ currentModel.source }} · {{ currentModel.license }}. Your photo stays on your device.</p>
            <div v-if="selectedModel === 'ormbg' || selectedModel === 'bria'" class="backend-picker"><span class="backend-label">PROCESSING BACKEND</span><div class="backend-options" role="group" :aria-label="`${currentModel.name} processing backend`"><button type="button" :class="{ selected: currentBackendChoice === 'wasm' }" :aria-pressed="currentBackendChoice === 'wasm'" :disabled="busy" @click="selectBackend('wasm')">WASM <small>Q8</small></button><button type="button" :class="{ selected: currentBackendChoice === 'webgpu' }" :aria-pressed="currentBackendChoice === 'webgpu'" :disabled="busy || !webgpuAvailable" @click="selectBackend('webgpu')">WebGPU <small>FP16</small></button></div><small v-if="!webgpuAvailable" class="backend-hint">WebGPU is unavailable in this browser.</small><small v-else class="backend-hint">Each option uses its own model format; compare speed and edges.</small></div>
            <div class="status-card" role="status" aria-live="polite"><div class="status-icon" :class="{ spinning: busy }">✳</div><div class="status-copy"><strong>{{ stageText }}</strong><span>{{ statusDetail }}<template v-if="phase === 'processing'"> · {{ elapsedSeconds }}s elapsed</template></span></div></div>
            <div v-if="phase === 'loading' && downloadProgress !== null" class="progress-wrap"><div class="progress-track"><span :style="{ width: `${downloadProgress}%` }"></span></div><small>{{ downloadFile }} · {{ downloadProgress }}%</small></div>
            <p v-if="error" class="error-text">{{ error }}</p><button v-if="busy" class="cancel-action" @click="cancelRun">Cancel this run</button>
            <button v-if="!loadedSelected && !busy" class="button button-outline full" @click="loadModel">Load selected model <span aria-hidden="true">↗</span></button><button v-if="originalUrl && !busy" class="button button-dark full run-button" @click="runSelected">{{ currentOutput ? 'Run again' : 'Run selected model' }} <span aria-hidden="true">↗</span></button>
          </div>

          <div class="control-section backdrop-section"><span class="section-index">04 / FINISH</span><div class="section-title-row"><div><h2>Choose a backdrop</h2><p class="section-description">Preview a look, then export it as a PNG.</p></div></div>
            <div class="swatch-grid" role="group" aria-label="Background choices"><button v-for="choice in choices" :key="choice.id" class="swatch" :class="{ selected: selected === choice.id }" :aria-pressed="selected === choice.id" @click="selectBackground(choice.id)"><span class="swatch-color" :class="{ checkered: choice.kind === 'transparent' }" :style="choice.kind === 'solid' ? { background: choice.color } : choice.kind === 'gradient' ? { background: `linear-gradient(135deg, ${choice.colors.join(', ')})` } : {}"><span v-if="selected === choice.id" class="swatch-check">✓</span></span><span>{{ choice.name }}</span></button></div>
            <div class="export-box"><div><strong>Ready for the final touch?</strong><span>Selected model · Full resolution PNG</span></div><a v-if="exportUrl && !busy" class="button button-accent" :href="exportUrl" :download="`${fileName.replace(/\.[^.]+$/, '') || 'image'}-${selectedModel}-${selected}.png`"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2v8m0 0 3-3m-3 3L5 7M3 12v2h10v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg> Download image</a><button v-else class="button button-accent" disabled>Download image</button></div>
          </div>

          <div class="cache-section"><div class="cache-top"><span class="section-index">MODEL STORAGE</span><span class="cache-indicator"></span></div><p>Saved in this browser’s <strong>Cache Storage</strong> for <code>{{ origin }}</code>. Find it in Developer Tools → Application → Cache Storage → <code>{{ CACHE_KEY }}</code>.</p><div class="cache-footer"><span>{{ cacheAvailable ? `${cacheFiles} cached files · ${cacheFiles ? cacheSize : 'No model saved yet'}` : 'Cache Storage unavailable' }}</span><button :disabled="!cacheFiles || busy" @click="clearCache">Clear all model caches ↗</button></div></div>
        </aside>
      </div>
      <section class="comparison-section" aria-label="Side by side model comparison">
        <div class="comparison-head"><div><span class="section-index">05 / COMPARE</span><h2>See the difference</h2><p>Each option runs on the same uploaded photo. Times show warm or cold inference only, excluding model loading and final PNG compositing.</p></div><span class="comparison-count">{{ completedCount }} / {{ comparisonItems.length }} COMPLETE</span></div>
        <div class="comparison-grid">
          <article v-for="item in comparisonItems" :key="item.key" class="comparison-card" :class="{ current: selectedModel === item.model.id && currentBackendChoice === item.choice }">
            <div class="comparison-visual" :style="outputs[item.key] ? previewStyle : {}">
              <div v-if="outputs[item.key] && selected === 'transparent'" class="checkerboard"></div>
              <img v-if="outputs[item.key]" :src="outputs[item.key].url" :alt="`${item.model.name} ${item.label} background removal result`" />
              <div v-else class="comparison-empty"><span>✳</span><small>{{ originalUrl ? 'Not tested yet' : 'Upload a photo first' }}</small></div>
            </div>
            <div class="comparison-card-footer"><div><strong>{{ item.model.name }}{{ item.label ? ` · ${item.label}` : '' }}</strong><span>{{ outputs[item.key] ? `${outputs[item.key].seconds}s inference · ${outputs[item.key].backend}` : item.choice.startsWith('webgpu') && !webgpuAvailable ? 'WebGPU unavailable' : item.model.license }}</span></div><button v-if="outputs[item.key]" @click="selectModel(item.model.id, item.choice)">Select ↗</button><button v-else :disabled="!originalUrl || busy || (item.choice.startsWith('webgpu') && !webgpuAvailable)" @click="selectModel(item.model.id, item.choice); runSelected()">Run ↗</button></div>
          </article>
        </div>
      </section>
      <footer class="page-footer"><span>Made for simple, private image making.</span><span>POWERED BY TRANSFORMERS.JS · RUNS LOCALLY</span></footer>
    </main>
  </div>
  </template>
  <script type="module" src="./app.js"></script>
</body>
</html>
